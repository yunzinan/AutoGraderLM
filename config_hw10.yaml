# AutoGraderLM Configuration

assignment_name: "Assignment 10"
assignment_path: "./hw10/"

web_server:
  port: 8081


assignment_configuration:
  pdf_folder_path: "res/"
  excel_in_path: "in.xls"

assignment_segmentation:
  num_workers: 5
  max_retry: 3
  llm: 
    model: "gpt-5.4"
    endpoint: "/v1/chat/completions"
    prompt_template: "./prompts/segmentation.jinja"
  

assignment_grading:
  num_workers: 10
  max_retry: 3
  llm: 
    model: "gpt-5.4"
    endpoint: "/v1/chat/completions"
    prompt_template: "./prompts/grading.jinja"
  
# 全量评分后：得分 <= 该比例 × 题目总分的作答自动进入人工复核列表
assignment_regrade:
  add_to_regrade_when_below: 0.999


assignment_report:
  num_workers: 5
  llm:
    model: "gpt-5.4"
    endpoint: "/v1/chat/completions"
    prompt_template: "./prompts/report.jinja"
  excel_out_path: "out.xls"

# 大模型对话日志，用于后台调试（记录请求 prompt 与响应内容）
# 每次写入后自动 flush；response_path 仅记录模型返回，便于 tail -f 实时查看
llm_log:
  enabled: true
  path: "./logs/llm_dialogue.log"
  response_path: "./logs/llm_response.log"


