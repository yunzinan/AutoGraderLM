# AutoGraderLM example configuration.
# Copy this file to config.yaml or another local YAML file, then adjust paths/model names.

assignment_name: "Example Assignment"
assignment_path: "./assignment_example/"

web_server:
  # Use 0.0.0.0 only when intentionally exposing the app on a trusted LAN.
  host: "127.0.0.1"
  port: 8081

assignment_configuration:
  pdf_folder_path: "res/"
  excel_in_path: "in.xls"

assignment_segmentation:
  # Experimental branch option: band_assign detects local answer-band candidates,
  # then asks the model to assign candidate IDs to question IDs instead of
  # inventing exact bbox coordinates. Other options: global, page_by_page.
  strategy: "band_assign"
  num_workers: 5
  max_retry: 3
  band_assign_fill_missing_with_page_by_page: true
  band_assign_min_assigned_ratio: 0.65
  postprocess:
    enabled: true
    full_width: true
    vertical_margin: 28
    snap_to_content: true
    snap_to_ink_bands: true
    candidate_bridge_gap: 36
    candidate_max_bands: 96
  llm:
    model: "your-vision-model"
    endpoint: "/v1/chat/completions"
    prompt_template: "./prompts/segmentation.jinja"
    timeout_seconds: 180

assignment_grading:
  num_workers: 5
  max_retry: 3
  llm:
    model: "your-vision-model"
    endpoint: "/v1/chat/completions"
    prompt_template: "./prompts/grading.jinja"
    timeout_seconds: 180

assignment_regrade:
  add_to_regrade_when_below: 0.20

assignment_report:
  num_workers: 3
  vision_max_images: 50
  vision_max_image_bytes: 6291456
  llm:
    model: "your-vision-model"
    endpoint: "/v1/chat/completions"
    prompt_template: "./prompts/report.jinja"
    timeout_seconds: 180
  excel_out_path: "out.xls"

llm_log:
  enabled: false
  path: "./logs/llm_dialogue.log"
  response_path: ""
  fsync: false
