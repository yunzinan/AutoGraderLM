# AutoGraderLM example configuration.
# Copy this file to config.yaml or another local YAML file, then adjust paths/model names.

assignment_name: "Example Assignment"
assignment_path: "./assignment_example/"

web_server:
  port: 8081

assignment_configuration:
  pdf_folder_path: "res/"
  excel_in_path: "in.xls"

assignment_segmentation:
  num_workers: 5
  max_retry: 3
  llm:
    model: "your-vision-model"
    endpoint: "/v1/chat/completions"
    prompt_template: "./prompts/segmentation.jinja"

assignment_grading:
  num_workers: 5
  max_retry: 3
  llm:
    model: "your-vision-model"
    endpoint: "/v1/chat/completions"
    prompt_template: "./prompts/grading.jinja"

assignment_regrade:
  add_to_regrade_when_below: 0.20

assignment_report:
  num_workers: 3
  vision_max_images: 50
  vision_max_image_bytes: 6291456
  llm:
    model: "your-vision-model"
    endpoint: "/v1/chat/completions"
    prompt_template: "./prompts/report.jinja"
  excel_out_path: "out.xls"

llm_log:
  enabled: false
  path: "./logs/llm_dialogue.log"
  response_path: ""
  fsync: false
