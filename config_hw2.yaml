# AutoGraderLM Configuration

assignment_name: "Assignment 2"
assignment_path: "./hw2/"

web_server:
  port: 8081


assignment_configuration:
  pdf_folder_path: "res/"
  excel_in_path: "in.xls"

assignment_segmentation:
  num_workers: 10
  max_retry: 3
  llm: 
    model: "gpt-5.2-chat-latest"
    endpoint: "/v1/chat/completions"
    prompt_template: "./prompts/segmentation.jinja"
  

assignment_grading:
  num_workers: 10
  max_retry: 3
  llm: 
    model: "gpt-5.2-chat-latest"
    endpoint: "/v1/chat/completions"
    prompt_template: "./prompts/grading.jinja"


assignment_report:
  llm:
    model: "gpt-5.2-chat-latest"
    endpoint: "/v1/chat/completions"
    prompt_template: "./prompts/report.jinja"
  excel_out_path: "out.xls"

# 大模型对话日志，用于后台调试（记录请求 prompt 与响应内容）
llm_log:
  enabled: true
  path: "./logs/llm_dialogue.log"


